# Stack PHARMACO auto-hébergée : PostgreSQL 16 + API + frontend (nginx).
# Démarrage :  cp .env.example .env  &&  (éditer .env)  &&  docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pharmaco
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: pharmaco
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pharmaco -d pharmaco']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://pharmaco:${POSTGRES_PASSWORD}@db:5432/pharmaco
      PGSSL: 'false'
      AUTH_SECRET: ${AUTH_SECRET:?Definir AUTH_SECRET dans .env}
      RUN_MIGRATIONS: 'true'
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-*}
      PORT: '4000'
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./client
      args:
        VITE_API_URL: /api
        VITE_USE_MOCK: 'false'
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      - api

volumes:
  pgdata:
