# Blueprint Render pour PHARMACO (frontend + backend).
# Déploiement : Render Dashboard -> New -> Blueprint -> sélectionner ce repo.
# Render lit ce fichier et crée/maj les deux services.
#
# La base de données est hébergée sur Supabase (PostgreSQL managé) :
# renseigner SUPABASE_URL dans le dashboard du service pharmaco-api.
# Guide complet : docs/DEPLOY-SUPABASE.md

services:
  # -------------------------------------------------------------------
  # Backend : API Express (base de données : Supabase)
  # -------------------------------------------------------------------
  - type: web
    name: pharmaco-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: SUPABASE_URL
        # URL de connexion PostgreSQL de Supabase, en mode « Session pooler »
        # (compatible IPv4 — la connexion directe est IPv6-only et ne
        # fonctionne pas depuis Render). À récupérer dans Supabase :
        # Project -> Connect -> Session pooler, ex :
        #   postgresql://postgres.<ref>:<mot_de_passe>@aws-0-<region>.pooler.supabase.com:5432/postgres
        # À renseigner dans le dashboard Render (valeur secrète).
        sync: false
      # Secret de signature des jetons (HMAC) : auto-généré par Render.
      # Obligatoire en production : sans lui, le serveur refuse de démarrer.
      - key: AUTH_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        # URL complète du frontend, ex : https://pharmaco-web.onrender.com
        # (à renseigner dans le dashboard après le 1er déploiement ;
        #  laisser vide autorise toutes les origines via CORS).
        sync: false

  # -------------------------------------------------------------------
  # Frontend : build Vite servi par `npm start` (vite preview)
  # -------------------------------------------------------------------
  - type: web
    name: pharmaco-web
    runtime: node
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: VITE_USE_MOCK
        value: "false"
      - key: VITE_API_URL
        # URL complète de l'API + /api, ex :
        #   https://pharmaco-api.onrender.com/api
        # Injectée AU BUILD : après l'avoir définie, relancer un déploiement.
        sync: false
