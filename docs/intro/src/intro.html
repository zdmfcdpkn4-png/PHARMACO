<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width={{W}}, height={{H}}" />
    <title>PHARMACO — introduction</title>
    <script src="assets/js/gsap.min.js"></script>
    <style>
      /* Police de la charte : Figtree, embarquée (aucun appel réseau au rendu). */
      @font-face {
        font-family: "Figtree";
        font-weight: 500;
        src: url("assets/fonts/figtree-latin-500-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Figtree";
        font-weight: 700;
        src: url("assets/fonts/figtree-latin-700-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Figtree";
        font-weight: 800;
        src: url("assets/fonts/figtree-latin-800-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Figtree";
        font-weight: 900;
        src: url("assets/fonts/figtree-latin-900-normal.woff2") format("woff2");
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        overflow: hidden;
        background: #e3eaf1;
      }

      /* Charte CHD — jetons repris de client/design.tokens.js. */
      #root {
        --bleu: #005586;
        --bleu-fonce: #00415f;
        --rose: #e82a63;
        --teal: #46b4b3;
        --jaune: #f4c137;
        --jaune-texte: #4a3a00;
        --gris-statut: #9aadbd;
        --fond: #eef4f8;
        --encre: #0e2f47;

        /* Tailles du format ordinateur ; le portrait les remplace plus bas. */
        --t1: 84px;
        --t2: 54px;
        --t-rail: 30px;
        --t-bulle: 38px;
        --t-ligne: 32px;
        --t-puce: 26px;
        --t-carte: 28px;
        --t-ecran: 30px;

        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Figtree", sans-serif;
        color: var(--encre);
      }
      #root[data-format="portrait"] {
        --t1: 96px;
        --t2: 60px;
        --t-rail: 46px;
        --t-bulle: 48px;
        --t-ligne: 42px;
        --t-puce: 34px;
        --t-carte: 38px;
        --t-ecran: 40px;
      }

      .clip {
        position: absolute;
        inset: 0;
      }
      .calque {
        position: absolute;
        inset: 0;
      }
      .abs {
        position: absolute;
      }
      img {
        display: block;
        user-select: none;
      }

      /* ---------- Fond permanent ---------- */
      #fond-degrade {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 75% 70% at 50% 45%, #eef3f8 0%, #e1e9f0 55%, #d2dde7 100%);
      }
      #fond-grille {
        position: absolute;
        left: -10%;
        top: -10%;
        width: 120%;
        height: 120%;
        opacity: 0;
      }
      .tache {
        position: absolute;
        border-radius: 50%;
        filter: blur(36px);
        opacity: 0.22;
      }

      /* ---------- Monde isométrique (actes 1 à 4) ---------- */
      #monde-leve {
        position: absolute;
        inset: 0;
      }
      #monde {
        position: absolute;
        left: 0;
        top: 0;
        width: 2752px;
        height: 1536px;
        transform-origin: 0 0;
        will-change: transform;
      }
      #decor {
        position: absolute;
        left: 0;
        top: 0;
        width: 2752px;
        height: 1536px;
        -webkit-mask-image: radial-gradient(ellipse 50% 54% at 50% 54%, #000 78%, transparent 100%);
        mask-image: radial-gradient(ellipse 50% 54% at 50% 54%, #000 78%, transparent 100%);
      }
      .ancre {
        position: absolute;
        width: 0;
        height: 0;
      }
      .pose {
        position: absolute;
        bottom: 0;
      }
      .miroir {
        transform: scaleX(-1);
      }
      #trajet {
        position: absolute;
        left: 0;
        top: 0;
        overflow: visible;
      }

      /* Post-it, enveloppe, feuille : dessinés en CSS, au style « jouet ». */
      .postit {
        position: absolute;
        bottom: 0;
        border-radius: 22px;
        box-shadow:
          0 18px 0 rgba(14, 47, 71, 0.16),
          inset 0 -14px 0 rgba(0, 0, 0, 0.07);
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-weight: 800;
        line-height: 1.05;
        padding: 18px;
        color: #2b2b2b;
      }
      .enveloppe {
        position: absolute;
        bottom: 0;
        background: #ffffff;
        border-radius: 22px;
        box-shadow:
          0 16px 0 rgba(14, 47, 71, 0.16),
          inset 0 -12px 0 rgba(0, 0, 0, 0.06);
        overflow: hidden;
      }
      .feuille {
        position: absolute;
        bottom: 0;
        background: #ffffff;
        border-radius: 18px;
        box-shadow:
          0 14px 0 rgba(14, 47, 71, 0.16),
          inset 0 -10px 0 rgba(0, 0, 0, 0.05);
      }
      .feuille i {
        position: absolute;
        left: 16%;
        height: 9%;
        border-radius: 99px;
        background: #d5e2ec;
      }

      /* ---------- Textes à l'écran ---------- */
      .titre {
        position: absolute;
        font-weight: 900;
        font-size: var(--t1);
        line-height: 1.04;
        letter-spacing: -0.03em;
        color: var(--bleu);
      }
      .titre.rose {
        color: var(--rose);
      }
      .titre.petit {
        font-size: var(--t2);
        font-weight: 800;
        color: var(--encre);
        letter-spacing: -0.02em;
      }
      .mot {
        display: inline-block;
        will-change: transform;
      }

      .bulle {
        position: absolute;
        padding: 0.42em 0.8em;
        background: #ffffff;
        border-radius: 1.2em;
        font-size: var(--t-bulle);
        font-weight: 800;
        color: var(--bleu);
        white-space: nowrap;
        box-shadow: 0 10px 0 rgba(14, 47, 71, 0.14);
        transform-origin: 50% 100%;
      }
      .bulle::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -0.5em;
        margin-left: -0.45em;
        border-left: 0.45em solid transparent;
        border-right: 0.45em solid transparent;
        border-top: 0.55em solid #ffffff;
      }
      .bulle.verte {
        background: #2e9e5b;
        color: #ffffff;
      }
      .bulle.verte::after {
        border-top-color: #2e9e5b;
      }

      /* Rail du circuit (acte 2). */
      #rail {
        position: absolute;
        display: flex;
        gap: 18px;
        align-items: center;
      }
      .etape {
        display: flex;
        align-items: center;
        gap: 0.45em;
        padding: 0.32em 0.7em 0.32em 0.38em;
        border-radius: 99px;
        background: #ffffff;
        font-size: var(--t-rail);
        font-weight: 800;
        color: var(--bleu);
        box-shadow: 0 8px 0 rgba(14, 47, 71, 0.12);
      }
      .etape b {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 1.45em;
        height: 1.45em;
        border-radius: 50%;
        background: #dbe6ee;
        color: var(--bleu);
        font-weight: 900;
        font-size: 0.9em;
      }
      .fleche {
        width: 26px;
        height: 4px;
        border-radius: 4px;
        background: #b9c9d6;
      }

      .etiquette {
        position: absolute;
        padding: 0.35em 0.75em;
        border-radius: 99px;
        background: var(--rose);
        color: #ffffff;
        font-size: var(--t-puce);
        font-weight: 800;
        white-space: nowrap;
        box-shadow: 0 8px 0 rgba(120, 10, 45, 0.22);
      }

      /* Tableau « Suivi des projets » (acte 4). */
      .panneau {
        position: absolute;
        background: #ffffff;
        border-radius: 34px;
        box-shadow:
          0 24px 0 rgba(14, 47, 71, 0.12),
          0 40px 80px rgba(14, 47, 71, 0.16);
        overflow: hidden;
      }
      .entete {
        position: absolute;
        left: 0;
        top: 0;
        right: 0;
        background: var(--bleu);
        color: #ffffff;
        font-weight: 900;
        display: flex;
        align-items: center;
      }
      .rangee {
        position: absolute;
        left: 0;
        display: flex;
        align-items: center;
        font-size: var(--t-ligne);
        font-weight: 700;
        color: var(--encre);
      }
      .puce {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 99px;
        font-size: var(--t-puce);
        font-weight: 800;
        padding: 0.2em 0.7em;
        white-space: nowrap;
      }
      .filet {
        position: absolute;
        height: 3px;
        background: #e3ebf2;
      }

      /* Stations du tour (actes 5 et 6). */
      #ville {
        position: absolute;
        left: 0;
        top: 0;
        width: 0;
        height: 0;
        transform-origin: 0 0;
        will-change: transform;
      }
      .station {
        position: absolute;
        width: 0;
        height: 0;
      }
      .socle {
        position: absolute;
        overflow: visible;
      }
      .ecran {
        position: absolute;
        background: #ffffff;
        border: 16px solid #34407a;
        border-radius: 34px;
        box-shadow:
          0 22px 0 rgba(14, 47, 71, 0.16),
          0 36px 70px rgba(14, 47, 71, 0.18);
        overflow: hidden;
        font-size: var(--t-ecran);
      }
      .ecran-titre {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        background: var(--bleu);
        color: #ffffff;
        font-weight: 900;
        display: flex;
        align-items: center;
        padding-left: 0.7em;
        letter-spacing: -0.01em;
      }
      .colonne {
        position: absolute;
        border-radius: 22px;
        background: #f1f6f9;
      }
      .colonne-titre {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        border-radius: 22px 22px 0 0;
        font-weight: 900;
        text-align: center;
        padding: 0.25em 0;
        font-size: 0.9em;
      }
      .carte {
        position: absolute;
        background: #ffffff;
        border-radius: 18px;
        box-shadow: 0 7px 0 rgba(14, 47, 71, 0.12);
        font-size: var(--t-carte);
        font-weight: 800;
        color: var(--encre);
        line-height: 1.05;
        padding: 0.45em 0.55em;
      }
      .barre {
        position: absolute;
        border-radius: 99px;
        transform-origin: 0 50%;
      }
      .noeud {
        position: absolute;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        font-weight: 900;
      }
      .message {
        position: absolute;
        border-radius: 20px;
        background: #f1f6f9;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 0.5em;
        padding: 0 0.6em;
        color: var(--encre);
      }
      .kpi {
        position: absolute;
        border-radius: 24px;
        background: #f1f6f9;
        padding: 0.4em 0.6em;
      }
      .kpi strong {
        display: block;
        font-weight: 900;
        line-height: 1;
        color: var(--bleu);
      }
      .kpi span {
        display: block;
        font-weight: 700;
        color: #4e6578;
      }

      /* Signature (acte 7). */
      #voile {
        position: absolute;
        inset: 0;
        background: var(--fond);
        opacity: 0;
      }
      .confetti {
        position: absolute;
        left: 0;
        top: 0;
        border-radius: 3px;
        opacity: 0;
        will-change: transform, opacity;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-width="{{W}}"
      data-height="{{H}}"
      data-duration="42"
      data-format="{{FORMAT}}"
    >
      <!-- Fond permanent : dégradé bleuté, grille isométrique, taches de couleur. -->
      <div id="fond" class="clip" data-start="0" data-duration="42" data-track-index="0">
        <div id="fond-degrade"></div>
        <svg id="fond-grille" aria-hidden="true">
          <defs>
            <pattern id="motif-iso" width="138.56" height="80" patternUnits="userSpaceOnUse">
              <path d="M0 0 L138.56 80 M0 80 L138.56 0" stroke="#005586" stroke-width="2" stroke-opacity="0.09" fill="none" />
            </pattern>
          </defs>
          <rect width="100%" height="100%" fill="url(#motif-iso)" />
        </svg>
        <div id="taches"></div>
      </div>

      <!-- Actes 1 à 4 : le monde isométrique de l'unité (décor, Fiole, pile). -->
      <section id="acte-unite" class="clip" data-start="0" data-duration="20.6" data-track-index="1">
        <div id="monde-leve"><div id="monde"></div></div>
      </section>

      <!-- Acte 1 : le logo de la pharmacotechnie, puis son badge. -->
      <section id="acte-logo" class="clip" data-start="0" data-duration="20.6" data-track-index="2">
        <div id="logo-unite" class="abs"></div>
      </section>

      <!-- Actes 2 à 4 : titres, rail du circuit, bulles, logo PHARMACO, tableau. -->
      <section id="acte-textes" class="clip" data-start="4" data-duration="16.6" data-track-index="3">
        <div id="calque-textes" class="calque"></div>
      </section>

      <!-- Actes 5 et 6 : le tour des vues, puis le tableau de bord. -->
      <section id="acte-tour" class="clip" data-start="20.3" data-duration="16.35" data-track-index="4">
        <div id="calque-ville" class="calque"><div id="ville"></div></div>
        <div id="calque-tour" class="calque"></div>
      </section>

      <!-- Acte 7 : signature et passage de relais au site. -->
      <section id="acte-signature" class="clip" data-start="36.45" data-duration="5.55" data-track-index="5">
        <div id="calque-signature" class="calque"></div>
        <div id="voile"></div>
        <div id="calque-final" class="calque"></div>
      </section>

      <!-- Musique (ElevenLabs via FLORA) : la première note tombe à 1,8 s du fichier. -->
      <audio id="musique" src="assets/audio/musique.mp3" data-start="0" data-duration="42" data-media-start="1.8" data-volume="0.8" data-fade-out="0.8" data-track-index="10"></audio>

      <!-- Bruitages (FLORA) : pop, whoosh, ding, cloche. -->
      <audio id="sfx-01" src="assets/audio/pop.mp3" data-start="0.35" data-duration="0.62" data-volume="0.55" data-track-index="11"></audio>
      <audio id="sfx-02" src="assets/audio/whoosh.mp3" data-start="2.25" data-duration="1.04" data-volume="0.4" data-track-index="12"></audio>
      <audio id="sfx-03" src="assets/audio/pop.mp3" data-start="3.6" data-duration="0.62" data-volume="0.45" data-track-index="11"></audio>

      <audio id="sfx-05" src="assets/audio/pop.mp3" data-start="5.15" data-duration="0.62" data-volume="0.4" data-track-index="11"></audio>

    <script>
      /* =====================================================================
         PHARMACO — introduction (42 s). Une seule source pour deux formats :
         data-format vaut « paysage » (1920×1080) ou « portrait » (1080×1920).
         Tout le mouvement tient dans UNE timeline en pause ; les éléments à
         trajectoire complexe (caméras, Fiole, poche) sont pilotés par des
         fonctions pures du temps, donc sûrs quel que soit l'ordre de lecture.
         ===================================================================== */
      const root = document.getElementById("root");
      const W = Number(root.dataset.width);
      const H = Number(root.dataset.height);
      const PORTRAIT = root.dataset.format === "portrait";
      const K = (paysage, portrait) => (PORTRAIT ? portrait : paysage);
      const tl = gsap.timeline({ paused: true });

      // Hasard déterministe (aucun Math.random) : même rendu à chaque fois.
      const hasard = (n) => {

      function camera(cles) {

          return cles[cles.length - 1];

        for (const s of SAUTS) {

            y = s.a[1];
            // Écrasement à l'atterrissage, sur 0,22 s.
            const apres = t - (s.t + s.d);
            if (apres < 0.22) sy = 1 - 0.14 * Math.sin((apres / 0.22) * Math.PI);

            x = s.de[0] + (s.a[0] - s.de[0]) * u;
            y = s.de[1] + (s.a[1] - s.de[1]) * u - s.h * 4 * u * (1 - u);

        return { x, y, sy, rot, p, visible };

      donut.setAttribute("height", String(tailleDonut));
      donut.setAttribute("viewBox", `0 0 ${tailleDonut} ${tailleDonut}`);
      Object.assign(donut.style, { position: "absolute", left: px(DN.x), top: px(DN.y) });
      tb.appendChild(donut);
      const circ = 2 * Math.PI * DN.r;
      let cumul = 0;
      PARTS.forEach((p, i) => {
        const arc = document.createElementNS(svgNS, "circle");
        arc.setAttribute("cx", String(tailleDonut / 2));
        arc.setAttribute("cy", String(tailleDonut / 2));
        arc.setAttribute("r", String(DN.r));
        arc.setAttribute("fill", "none");
        arc.setAttribute("stroke", STATUT[p.s][0]);
        arc.setAttribute("stroke-width", String(epaisseurDonut));
        arc.setAttribute("transform", `rotate(${-90 + cumul * 360} ${tailleDonut / 2} ${tailleDonut / 2})`);
        donut.appendChild(arc);
        const L = circ * p.v;
        arc.style.strokeDasharray = `${L} ${circ}`;
        tl.fromTo(arc, { strokeDashoffset: L }, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, T6 + 1.25 + i * 0.3);
        cumul += p.v;
      });
      // Légende.
      PARTS.forEach((p, i) => {
        const lg = el("div", tb, "abs", {
          left: px(DN.x + tailleDonut + K(24, 20)),
          top: px(DN.y + 30 + i * K(58, 66)),
          display: "flex",
          alignItems: "center",
          gap: "12px",
          fontWeight: "800",
          fontSize: K("26px", "32px"),
        });
        el("i", lg, "", { display: "inline-block", width: "26px", height: "26px", borderRadius: "8px", background: STATUT[p.s][0] });
        el("span", lg, "", {}, p.s);
        pop(lg, T6 + 1.3 + i * 0.3, { depuis: 0.5, d: 0.3, ease: "power3.out" });
      });
      // Barres : tâches faites par semaine.
      const BR = K({ x: 736, y: hT + 230, h: 300, w: 58, pas: 82 }, { x: 560, y: hT + 520, h: 160, w: 54, pas: 76 });
      if (!PORTRAIT) {
        const HAUTEURS = [0.42, 0.56, 0.5, 0.72, 0.9];
        HAUTEURS.forEach((hh, i) => {
          const b = el("div", tb, "abs", {
            left: px(BR.x + i * BR.pas),
            top: px(BR.y + BR.h * (1 - hh)),
            width: px(BR.w),
            height: px(BR.h * hh),
            borderRadius: "14px 14px 6px 6px",
            background: i === HAUTEURS.length - 1 ? "#46b4b3" : "#bcd0df",
            transformOrigin: "50% 100%",
          });
          tl.fromTo(b, { scaleY: 0 }, { scaleY: 1, duration: 0.6, ease: "power3.out" }, T6 + 1.85 + i * 0.08);
        });
        el(
          "div",
          tb,
          "abs",
          { left: px(BR.x), top: px(BR.y + BR.h + 16), width: px(BR.pas * 5), fontWeight: "800", color: "#6b8296", fontSize: "24px" },
          "Tâches faites / semaine",
        );
      }
      // La pharmacienne, café en main, s'adosse.
      const pharma = ancre(tour, K(330, 250), K(1010, 1880));
      pose(pharma, "pharmacienne-cafe.png", K(470, 430));
      tl.fromTo(pharma, { x: -K(520, 480), rotation: -8, opacity: 0 }, { x: 0, rotation: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, T6 + 1.45);
      tl.fromTo(pharma, { rotation: 0 }, { rotation: -3, duration: 0.8, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false }, T6 + 2.3);
      tl.to([tb, pharma], { opacity: 0, scale: 0.92, duration: 0.3, ease: "power2.in" }, 36.05);

      /* =====================================================================
         ACTE 7 — Signature (36,45 → 42 s)
         ===================================================================== */
      const sig = document.getElementById("calque-signature");
      const fin = document.getElementById("calque-final");
      const T7 = 36.45;

      // L'unité entière, en plan large, et l'équipe qui salue.
      const SIG = K(
        { decor: { x: 960, y: 840, s: 0.4 }, logo: [960, 240], taille: 230, nom: 104, slogan: 44 },
        { decor: { x: 540, y: 1370, s: 0.44 }, logo: [540, 470], taille: 330, nom: 124, slogan: 52 },
      );
      const decorSig = el("img", sig, "abs", {
        width: px(2752 * SIG.decor.s),
        height: px(1536 * SIG.decor.s),
        left: px(SIG.decor.x - (1375 * SIG.decor.s)),
        top: px(SIG.decor.y - (805 * SIG.decor.s)),
        WebkitMaskImage: "radial-gradient(ellipse 50% 54% at 50% 54%, #000 78%, transparent 100%)",
        maskImage: "radial-gradient(ellipse 50% 54% at 50% 54%, #000 78%, transparent 100%)",
      });
      decorSig.src = "assets/img/decor.jpg";
      decorSig.alt = "";
      tl.fromTo(decorSig, { scale: 1.35, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.9, ease: "power3.out" }, T7);
      const EQUIPE = K(
        [
          ["pharmacienne-salue.png", 380, 1010, 280],
          ["preparateur-salue.png", 590, 1030, 260],
          ["fiole-saute.png", 960, 1055, 220],
          ["cadre.png", 1330, 1030, 270],
          ["logisticien.png", 1540, 1010, 270],
        ],
        [
          ["pharmacienne-salue.png", 170, 1650, 280],
          ["preparateur-salue.png", 365, 1680, 255],
          ["fiole-saute.png", 540, 1700, 215],
          ["cadre.png", 725, 1680, 265],
          ["logisticien.png", 915, 1650, 265],
        ],
      );
      EQUIPE.forEach(([f, x, y, h], i) => {
        const a = ancre(sig, x, y);
        pose(a, f, h);
        pop(a, T7 + 0.3 + i * 0.07, { depuis: 0, y: 80, d: 0.5, ease: "back.out(1.6)" });
        tl.fromTo(a, { rotation: 0 }, { rotation: i % 2 ? 4 : -4, duration: 0.35, ease: "sine.inOut", yoyo: true, repeat: 5, immediateRender: false }, T7 + 1.0 + i * 0.05);
        if (f === "fiole-saute.png") {
          tl.fromTo(a, { y: 0 }, { y: -90, duration: 0.3, ease: "power2.out", yoyo: true, repeat: 3, immediateRender: false }, T7 + 1.1);
        }
      });
      // Flou de profondeur pendant que la marque s'installe.
      tl.fromTo(sig, { filter: "blur(0px)" }, { filter: "blur(2px)", duration: 0.6, ease: "power2.out" }, T7 + 1.0);

      // Le logo PHARMACO éclot, le nom tombe lettre à lettre, puis la phrase.
      const marque = el("div", fin, "abs", { left: px(SIG.logo[0]), top: px(SIG.logo[1]), width: "0px", height: "0px" });
      const haloSig = el("div", marque, "abs", {
        left: px(-SIG.taille),
        top: px(-SIG.taille),
        width: px(SIG.taille * 2),
        height: px(SIG.taille * 2),
        borderRadius: "50%",
        background: "radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0) 66%)",
      });
      const logoSig = el("img", marque, "abs", {
        width: px(SIG.taille),
        height: px(SIG.taille),
        left: px(-SIG.taille / 2),
        top: px(-SIG.taille / 2),
      });
      logoSig.src = "assets/img/logo-pharmaco.png";
      logoSig.alt = "";
      tl.fromTo(haloSig, { scale: 0.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "power2.out" }, T7 + 0.7);
      tl.fromTo(logoSig, { scale: 0, rotation: -120 }, { scale: 1, rotation: 0, duration: 0.8, ease: "back.out(1.5)" }, T7 + 0.75);
      const nomMarque = el("div", fin, "abs", {
        left: "0px",
        right: "0px",
        top: px(SIG.logo[1] + SIG.taille / 2 + K(14, 20)),
        textAlign: "center",
        fontWeight: "900",
        fontSize: px(SIG.nom),
        letterSpacing: "0.04em",
        color: "#005586",
        lineHeight: "1",
      });
      "PHARMACO".split("").forEach((l, i) => {
        const s = el("span", nomMarque, "mot", {}, l);
        tl.fromTo(s, { y: -120, opacity: 0, rotation: -12 }, { y: 0, opacity: 1, rotation: 0, duration: 0.45, ease: "back.out(2)" }, T7 + 1.15 + i * 0.045);
      });
      const slogan = el(
        "div",
        fin,
        "abs",
        {
          left: px(K(260, 60)),
          right: px(K(260, 60)),
          top: px(SIG.logo[1] + SIG.taille / 2 + K(14, 20) + SIG.nom + K(18, 26)),
          textAlign: "center",
          fontWeight: "800",
          fontSize: px(SIG.slogan),
          color: "#0e2f47",
          lineHeight: "1.15",
        },
        `<span class="mot">L’équipe</span> <span class="mot">et</span> <span class="mot">ses</span> <span class="mot">projets,</span>${PORTRAIT ? "<br>" : " "}<span class="mot" style="color:#e82a63">en</span> <span class="mot" style="color:#e82a63">un</span> <span class="mot" style="color:#e82a63">coup</span> <span class="mot" style="color:#e82a63">d’œil.</span>`,
      );
      slogan.querySelectorAll(".mot").forEach((m, i) => {
        tl.fromTo(m, { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "expo.out" }, T7 + 1.75 + i * 0.05);
      });

      // Confettis aux couleurs de la charte (gerbe de particules, déterministe).
      const champ = el("div", fin, "abs", { left: px(SIG.logo[0]), top: px(SIG.logo[1]), width: "0px", height: "0px" });
      const PALETTE = ["#005586", "#e82a63", "#46b4b3", "#f4c137"];
      const confettis = [];
      for (let i = 0; i < 30; i++) {
        const taille = 10 + hasard(i * 3 + 1) * 10;
        const c = el("div", champ, "confetti", { width: px(taille), height: px(taille * 0.65), background: PALETTE[i % 4] });
        const angle = -Math.PI / 2 + (hasard(i * 5 + 2) * 2 - 1) * 1.15;
        const vitesse = K(700, 820) + hasard(i * 7 + 3) * K(650, 700);
        confettis.push({ c, vx: Math.cos(angle) * vitesse, vy: Math.sin(angle) * vitesse, spin: (hasard(i * 11 + 4) * 2 - 1) * 600 });
      }
      const vol = { T: 0 };
      const DUREE_VOL = 1.6;
      tl.fromTo(
        vol,
        { T: 0 },
        {
          T: 1,
          duration: DUREE_VOL,
          ease: "none",
          onUpdate: () => {
            const t = vol.T * DUREE_VOL;
            const fondu = Math.min(1, (1 - vol.T) / 0.3);
            confettis.forEach((p) => {
              const x = p.vx * t;
              const y = p.vy * t + 0.5 * 1500 * t * t;
              p.c.style.transform = `translate(${x}px, ${y}px) rotate(${p.spin * t}deg)`;
              p.c.style.opacity = String(vol.T === 0 ? 0 : fondu);
            });
          },
        },
        38.95,
      );

      // Signature de l'unité : le logo de la pharmacotechnie.
      const signature = el("div", fin, "abs", K({ right: "48px", top: "40px" }, { left: "0px", right: "0px", bottom: "56px" }));
      const SG = K({ emb: 110, nomW: 330 }, { emb: 120, nomW: 380 });
      Object.assign(signature.style, { display: "flex", alignItems: "center", justifyContent: "center", gap: "18px" });
      const sEmb = el("img", signature, "", { width: px(SG.emb), height: px(SG.emb) });
      sEmb.src = "assets/img/pharmaco-embleme.webp";
      sEmb.alt = "";
      const sTxt = el("div", signature, "", { display: "flex", flexDirection: "column", gap: "6px" });
      const sNom = el("img", sTxt, "", { width: px(SG.nomW), height: px((SG.nomW * 106) / 671) });
      sNom.src = "assets/img/pharmaco-nom.webp";
      sNom.alt = "";
      const sUnite = el("img", sTxt, "", { width: px(SG.nomW * 0.78), height: px((SG.nomW * 0.78 * 108) / 508) });
      sUnite.src = "assets/img/pharmaco-unite.webp";
      sUnite.alt = "";
      tl.fromTo(signature, { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, T7 + 2.85);

      // Passage de relais : le logo rejoint le coin du site, le reste s'efface.
      const COIN = K({ x: 46, y: 42, s: 50 }, { x: 74, y: 92, s: 84 });
      tl.to("#voile", { opacity: 1, duration: 0.85, ease: "power2.inOut" }, 41.0);
      tl.to([nomMarque, slogan, signature, haloSig], { opacity: 0, duration: 0.45, ease: "power2.in" }, 40.95);
      tl.to(
        marque,
        { x: COIN.x - SIG.logo[0], y: COIN.y - SIG.logo[1], scale: COIN.s / SIG.taille, duration: 0.9, ease: "power3.inOut" },
        41.0,
      );

      // La timeline n'est enregistrée qu'une fois entièrement construite.
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
